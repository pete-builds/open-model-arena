name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  # For SLSA build-provenance attestations (keyless cosign via OIDC).
  id-token: write
  attestations: write

jobs:
  build-and-push:
    name: Build + push container image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage runtime config from example
        run: cp models.yaml.example models.yaml

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build + push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/pete-builds/open-model-arena:${{ steps.version.outputs.version }}
            ghcr.io/pete-builds/open-model-arena:v${{ steps.version.outputs.version }}
            ghcr.io/pete-builds/open-model-arena:latest
          labels: |
            org.opencontainers.image.source=https://github.com/pete-builds/open-model-arena
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (SLSA v1, cosign keyless)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/pete-builds/open-model-arena
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  bump-example-compose:
    name: Bump docker-compose.yml example image tag
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v7
        with:
          # Need write access to push the bot commit back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump image tag in docker-compose.yml
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          # Fetch + check out main so the bot's push has somewhere to land.
          git fetch origin main
          git checkout main
          # Only rewrite the pinned image tag; leave everything else alone.
          # Pattern matches ghcr.io/pete-builds/open-model-arena:X.Y.Z (semver only).
          sed -i -E \
            "s|(ghcr\.io/pete-builds/open-model-arena:)[0-9]+\.[0-9]+\.[0-9]+|\1${VERSION}|" \
            docker-compose.yml
          if git diff --quiet docker-compose.yml; then
            echo "docker-compose.yml already at ${VERSION}, nothing to bump"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          # [skip ci] prevents the bot push from re-triggering CI.
          git commit -m "compose: bump example image to ${VERSION} [skip ci]"
          git push origin main

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        run: |
          python3 <<'PYEOF' > release-notes.md
          import re, pathlib, os
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          if m:
              print(m.group(1).strip())
          else:
              print(f"See [CHANGELOG.md](CHANGELOG.md) for details on {version}.")
          PYEOF

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
