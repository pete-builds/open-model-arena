name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  # For SLSA build-provenance attestations (keyless cosign via OIDC).
  id-token: write
  attestations: write

jobs:
  verify-version:
    name: Tag matches pyproject and compose pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The compose pin used to be bumped by a bot push, which branch
      # protection always rejected. It is bumped in the release commit now,
      # so this job is the thing that catches a forgotten bump - before an
      # image is published under a tag the repo disagrees with.
      - name: Compare tag against the tree
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          PYPROJECT=$(sed -nE 's/^version = "(.*)"$/\1/p' pyproject.toml | head -1)
          COMPOSE=$(sed -nE 's|.*ghcr\.io/pete-builds/open-model-arena:([0-9]+\.[0-9]+\.[0-9]+).*|\1|p' docker-compose.yml | head -1)
          echo "tag=${VERSION}  pyproject=${PYPROJECT}  compose=${COMPOSE}"
          fail=0
          [ "$PYPROJECT" = "$VERSION" ] || { echo "::error::pyproject.toml is ${PYPROJECT}, tag is ${VERSION}"; fail=1; }
          [ "$COMPOSE" = "$VERSION" ] || { echo "::error::docker-compose.yml pins ${COMPOSE}, tag is ${VERSION}"; fail=1; }
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [${VERSION}] section"; fail=1; }
          exit $fail

  build-and-push:
    name: Build + push container image
    runs-on: ubuntu-latest
    needs: verify-version
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage runtime config from example
        run: cp models.yaml.example models.yaml

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build + push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/pete-builds/open-model-arena:${{ steps.version.outputs.version }}
            ghcr.io/pete-builds/open-model-arena:v${{ steps.version.outputs.version }}
            ghcr.io/pete-builds/open-model-arena:latest
          labels: |
            org.opencontainers.image.source=https://github.com/pete-builds/open-model-arena
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (SLSA v1, cosign keyless)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/pete-builds/open-model-arena
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        run: |
          python3 <<'PYEOF' > release-notes.md
          import re, pathlib, os
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          if m:
              print(m.group(1).strip())
          else:
              print(f"See [CHANGELOG.md](CHANGELOG.md) for details on {version}.")
          PYEOF

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
