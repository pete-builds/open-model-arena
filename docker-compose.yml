# Public deployment recipe: pinned image from GHCR.
# The image tag is auto-bumped by the release workflow on every tag push,
# so a plain `git pull` on the source of truth stays current.
#
# To build from source instead (local dev):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# To pin host-specific tweaks (network mode, port mapping, extra env),
# add a `docker-compose.override.yml` — Docker Compose merges it in
# automatically. That file is gitignored so it never leaks upstream.

services:
  model-arena:
    image: ghcr.io/pete-builds/open-model-arena:0.2.0
    container_name: model-arena
    restart: unless-stopped
    ports:
      - "3694:3694"
    volumes:
      - arena-data:/app/data
      - ./models.yaml:/app/models.yaml:ro
    environment:
      - ARENA_PASSPHRASE=${ARENA_PASSPHRASE}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
      - GATEWAY_API_KEY=${GATEWAY_API_KEY}
      - ARENA_API_TOKENS=${ARENA_API_TOKENS:-}
      - TZ=${TZ:-America/New_York}
    networks:
      - arena-net

volumes:
  arena-data:

networks:
  arena-net:
